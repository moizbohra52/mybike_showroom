name: mybike_showroom
description: "MyBike - multi-showroom bike dealership management & accounting ERP (Android, iOS, Web, Windows)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management + dependency injection (Phase 1)
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Declarative routing with web deep links + redirect guards (Phase 1)
  go_router: 17.5.0 # pinned: 18.x pulls material_ui 1.3.0 which fails to compile on Flutter 3.44.8

  # Local preferences: theme mode, selected showroom, last filters (Phase 1)
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

